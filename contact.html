<main class="pt-32 pb-24 max-w-7xl mx-auto px-6">
        <div class="text-center mb-16">
            <h1 class="text-5xl font-serif text-dark mb-4">Connect With Us</h1>
            <p class="text-gray-500">Request an appointment or ask us anything. We are here for you.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
            <div class="bg-white p-8 border border-gray-100 shadow-sm">
                <form action="#" method="POST" class="space-y-6">
                    <div>
                        <label class="block text-sm uppercase tracking-widest text-gray-600 mb-2">Full Name *</label>
                        <input type="text" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-gold-500 transition-colors bg-transparent">
                    </div>
                    <div>
                        <label class="block text-sm uppercase tracking-widest text-gray-600 mb-2">Phone Number *</label>
                        <input type="tel" required class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-gold-500 transition-colors bg-transparent">
                    </div>
                    <div>
                        <label class="block text-sm uppercase tracking-widest text-gray-600 mb-2">Service of Interest</label>
                        <select class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-gold-500 transition-colors bg-transparent text-gray-600">
                            <option>Hair Styling</option>
                            <option>Spa & Massage</option>
                            <option>Bridal Package</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm uppercase tracking-widest text-gray-600 mb-2">Message</label>
                        <textarea rows="4" class="w-full border-b border-gray-300 py-2 focus:outline-none focus:border-gold-500 transition-colors bg-transparent"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-dark text-white py-4 uppercase tracking-widest text-sm hover:bg-gold-500 transition-colors">Submit Request</button>
                </form>
            </div>

            <div class="space-y-8">
                <div>
                    <h3 class="text-xl font-serif text-dark mb-4">Studio Information</h3>
                    <p class="text-gray-500 mb-2"><strong class="text-dark">Address:</strong> 123 Luxury Avenue, New York, NY 10001</p>
                    <p class="text-gray-500 mb-2"><strong class="text-dark">Email:</strong> hello@aurastudio.com</p>
                    <p class="text-gray-500"><strong class="text-dark">Phone:</strong> +1 (555) 123-4567</p>
                </div>
                
                <div class="w-full h-64 bg-gray-200">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.2152599797086!2d-73.98784848459418!3d40.75889497932681!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25855c6480299%3A0x55194ec5a1ae072e!2sTimes%20Square!5e0!3m2!1sen!2sus!4v1655325851498!5m2!1sen!2sus" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </main>
